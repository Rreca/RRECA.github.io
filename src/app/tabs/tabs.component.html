<ion-header class="nudos-header">
  <ion-toolbar>
    <div class="context-switch">
      <button class="context-btn" [class.active]="activeFilter==='HOME'"   (click)="setFilter('HOME')">🏠 <span>Casa</span></button>
      <button class="context-btn" [class.active]="activeFilter==='STREET'" (click)="setFilter('STREET')">🚶 <span>Calle</span></button>
      <button class="context-btn" [class.active]="activeFilter==='WORK'"   (click)="setFilter('WORK')">💼 <span>Trabajo</span></button>
      <button class="context-btn" [class.active]="activeFilter==='ANY'"    (click)="setFilter('ANY')">🌐 <span>General</span></button>
      <span class="context-divider"></span>
      <button class="context-btn context-all" [class.active]="activeFilter==='ALL'" (click)="setFilter('ALL')">ALL</button>
      <ng-container *ngIf="timerRunning">
        <span class="context-divider"></span>
        <span class="timer-chip">{{ timerLabel }}</span>
      </ng-container>
    </div>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom" class="nudos-tab-bar">
    <ion-tab-button tab="today" href="/today">
      <ion-icon name="today"></ion-icon>
      <ion-label>Hoy</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="openCapture()" class="capture-btn">
      <ion-icon name="add"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="insights" href="/insights">
      <ion-icon name="bar-chart"></ion-icon>
      <ion-label>Análisis</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
