<ion-header>
  <!-- v2 -->
  <ion-toolbar>
    <ion-title>Capturar nudo</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="!systemFullMessage" fill="solid" color="primary"
        style="--border-radius: 999px; font-weight: 700; font-size: 13px;"
        (click)="submit()">
        Crear
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div style="padding: 16px;">

    <!-- Sistema lleno -->
    <div *ngIf="systemFullMessage" class="notice" style="border-left: 3px solid var(--color-danger);">
      {{ systemFullMessage }}
    </div>

    <div *ngIf="!systemFullMessage">

      <div class="notice">
        Regla: si hay <b>EN PROGRESO</b> o ya tenés <b>3 DESBLOQUEABLES</b>, no podés capturar.
      </div>

      <!-- Título -->
      <div class="field">
        <label>Título</label>
        <input [(ngModel)]="title" placeholder="Ej: pagar impuesto, llamar al médico..." class="ion-input-native" />
      </div>

      <!-- Contexto -->
      <div class="field">
        <label>Contexto</label>
        <select [(ngModel)]="contextPick" class="ion-select-native">
          <option value="AUTO">Auto-detectar</option>
          <option value="HOME">🏠 Casa</option>
          <option value="STREET">🚶 Calle</option>
          <option value="WORK">💼 Trabajo</option>
          <option value="ANY">🌐 General</option>
        </select>
      </div>

      <!-- Motivo -->
      <div class="field">
        <label>Motivo del bloqueo</label>
        <select [(ngModel)]="blockReason" (ngModelChange)="onReasonChange()" class="ion-select-native">
          <option value="NO_START">No sé por dónde empezar</option>
          <option value="LAZINESS">Pereza</option>
          <option value="FEAR">Miedo</option>
          <option value="EXTERNAL">Depende de un externo</option>
          <option value="NOT_TODAY">No hoy</option>
        </select>
      </div>

      <!-- Próximo paso -->
      <div *ngIf="showNextStep" class="field">
        <label>Próximo paso (obligatorio)</label>
        <input [(ngModel)]="nextStep" placeholder="Ej: abrir la web y buscar el trámite" class="ion-input-native" />
      </div>

      <!-- Minutos estimados -->
      <div *ngIf="showEstMinutes" class="field">
        <label>Minutos estimados (máx 5)</label>
        <input type="number" [(ngModel)]="estMinutes" min="1" max="60" class="ion-input-native" />
      </div>

      <!-- Espera externa -->
      <div *ngIf="showExternalWait" class="field">
        <label>Espera externa (obligatorio)</label>
        <input [(ngModel)]="externalWait" placeholder="Ej: respuesta del banco / turno" class="ion-input-native" />
      </div>

      <!-- Fricción / Impacto -->
      <div style="display: flex; gap: 16px;">
        <div class="field" style="flex: 1;">
          <label>Fricción (1–5)</label>
          <input type="number" [(ngModel)]="friction" min="1" max="5" class="ion-input-native" />
        </div>
        <div class="field" style="flex: 1;">
          <label>Impacto (1–5)</label>
          <input type="number" [(ngModel)]="impact" min="1" max="5" class="ion-input-native" />
        </div>
      </div>

      <!-- Cadena -->
      <div class="field" style="margin-top: 16px;">
        <label>Cadena</label>
        <select [(ngModel)]="chainOption" class="ion-select-native">
          <option value="none">Sin cadena</option>
          <option value="new">Crear nueva cadena</option>
          <option value="existing">Agregar a cadena existente</option>
        </select>
      </div>

      <!-- Nueva cadena -->
      <div *ngIf="chainOption === 'new'" class="field">
        <label>Nombre de la cadena (1–50 caracteres)</label>
        <input [(ngModel)]="newChainName" placeholder="Ej: Proceso de mudanza" maxlength="50" class="ion-input-native" />
        <div *ngIf="chainNameError" class="hint" style="color: var(--color-danger); margin-top: 4px;">{{ chainNameError }}</div>
      </div>

      <!-- Cadena existente -->
      <div *ngIf="chainOption === 'existing'" class="field">
        <div *ngIf="chains.length === 0" class="notice">
          No hay cadenas disponibles. Seleccioná "Crear nueva cadena" para crear una.
        </div>
        <div *ngIf="chains.length > 0">
          <label>Seleccionar cadena</label>
          <select [(ngModel)]="selectedChainId" class="ion-select-native">
            <option [value]="null" disabled>— Elegí una cadena —</option>
            <option *ngFor="let c of chains" [value]="c.id">{{ c.name }} ({{ getChainKnotCount(c.id) }} nudos)</option>
          </select>
          <div *ngIf="chainCapacityError" class="hint" style="color: var(--color-danger); margin-top: 4px;">{{ chainCapacityError }}</div>
        </div>
      </div>

      <!-- Botón Crear al fondo (accesibilidad / UX) -->
      <div style="margin-top: 24px;">
        <ion-button expand="block" fill="solid" color="primary"
          style="--border-radius: 14px; font-weight: 700;"
          (click)="submit()">
          Crear nudo
        </ion-button>
      </div>

    </div>

    <!-- Si sistema lleno -->
    <div *ngIf="systemFullMessage" style="margin-top: 16px;">
      <ion-button expand="block" fill="outline" (click)="dismiss()">Cerrar</ion-button>
    </div>

  </div>
</ion-content>
